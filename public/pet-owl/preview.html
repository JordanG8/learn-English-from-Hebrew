<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your owl’s garden · Animation preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf5e9;color:#493b32;font-family:system-ui,sans-serif}main{max-width:1100px;margin:24px auto;padding:0 16px}h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}p{margin:0 0 18px;color:#746655}.garden{position:relative;aspect-ratio:3/2;background:url('garden.png') center/cover;border-radius:26px;overflow:hidden;box-shadow:0 12px 38px #4d422322}.pet{position:absolute;width:26%;aspect-ratio:1;left:37%;top:46%;filter:drop-shadow(0 12px 7px #775b292b)}.owl{width:100%;height:100%;background-image:url('owl-sprites.png');background-size:400% 400%;background-position:0 0;animation:frames 3.6s steps(1) infinite}.owl[data-state=celebrate]{background-position-y:33.333333%;animation-duration:.9s}.owl[data-state=hop]{background-position-y:66.666667%;animation-duration:.8s}.owl[data-state=sleep]{background-position-y:100%;animation-duration:3.2s}@keyframes frames{0%,100%{background-position-x:0}25%{background-position-x:33.333333%}50%{background-position-x:66.666667%}75%{background-position-x:100%}}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}button{min-height:48px;padding:10px 20px;border:2px solid #ddcda8;border-radius:18px;background:#fffdf5;color:#493b32;font:inherit;font-weight:650;cursor:pointer}button[aria-pressed=true]{background:#76599a;color:white;border-color:#76599a}button:focus-visible{outline:3px solid #32706a;outline-offset:3px}.note{text-align:center;font-size:14px}@media(prefers-reduced-motion:reduce){.owl{animation:none!important}}
</style></head><body><main><h1>Your owl’s garden</h1><p>A little home that can grow with every learning adventure.</p><div class="garden" role="img" aria-label="A cozy walled garden with a flowering tree house and a friendly golden owl"><div class="pet"><div class="owl" data-state="idle"></div></div></div><nav aria-label="Preview owl animations"><button data-state="idle" aria-pressed="true">Blink & breathe</button><button data-state="celebrate" aria-pressed="false">Celebrate</button><button data-state="hop" aria-pressed="false">Happy hop</button><button data-state="sleep" aria-pressed="false">Sleep</button><button id="pause" aria-pressed="false">Pause</button></nav><p class="note">Animation preview · Garden decorations and earned rewards will use this space.</p></main><script>
const owl=document.querySelector('.owl');document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>{owl.dataset.state=button.dataset.state;document.querySelectorAll('button[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));document.querySelector('#pause').addEventListener('click',event=>{const paused=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(paused));event.currentTarget.textContent=paused?'Resume':'Pause';owl.style.animationPlayState=paused?'paused':'running'});
</script></body></html>
